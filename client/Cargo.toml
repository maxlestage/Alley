[package]
name = "alley-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Le navigateur d'Alley, en Rust compilé en WebAssembly : chiffrement Brocolis, salons éphémères, appels WebRTC, vitrine"
publish = false

# Une seule crate pour les deux côtés : compilée en WebAssembly, c'est tout le
# code du navigateur ; compilée normalement, son module `crypto` sert aux tests
# du serveur (exactement le même chiffrement).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Les signatures : tout ce qu'envoie un membre est signé de sa clé Ed25519.
ed25519-dalek = "2"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alley-moderation = { path = "../moderation" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AnalyserNode",
  "AudioContext",
  "AudioNode",
