[package]
name = "alley"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Alley : l'équivalent de Discord où tout est chiffré de bout en bout (protocole Brocolis), servi par une App Paquets"
publish = false
build = "build.rs"

# Le navigateur (`client/`, Rust compilé en WebAssembly) vit dans le même
# espace de travail.
[workspace]
members = ["client", "xtask"]

[[bin]]
name = "alley"
path = "src/main.rs"

[dependencies]
# Le framework full-stack : Vitesse (le web, WebSocket) + Securite (le bouclier)
# + Memoire (les données) + Active (les pages, la PWA).
paquets = { git = "https://github.com/maxlestage/Paquets" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
base64 = "0.22"

[dev-dependencies]
# Les tests chiffrent exactement comme le navigateur : avec le même code Rust.
alley-web = { path = "client" }
# De vrais salons, en vraie WebSocket.
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Le code du navigateur :
# `cargo build -p alley-web --lib --target wasm32-unknown-unknown --profile wasm-release`
# (voir scripts/web.sh).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
