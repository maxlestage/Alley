[package]
name = "alley"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Alley : des salons de discussion éphémères, chiffrés de bout en bout (protocole Brocolis), servis par une App Paquets"
publish = false
build = "build.rs"

# Le navigateur (`client/`, Rust compilé en WebAssembly) vit dans le même
# espace de travail.
[workspace]
members = ["client", "moderation"]
# Les outils (`cargo xtask`) ont leur propre espace : ils se construisent sans
# le reste (ni Paquets), par exemple pour fusionner ou déployer.
exclude = ["xtask"]

[[bin]]
name = "alley"
path = "src/main.rs"

[dependencies]
# Le framework full-stack : Vitesse (le web, WebSocket) + Securite (le bouclier)
# + Memoire (les données) + Active (les pages, la PWA).
paquets = { git = "https://github.com/maxlestage/Paquets" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
# Le serveur signe ce qu'il dit d'un salon : l'appareil qui le retient
# vérifie que personne ne l'a modifié.
ed25519-dalek = "2"
# Les abonnements : la signature des webhooks de Stripe, et ses appels.
hmac = "0.12"
ureq = "3"
tracing = "0.1"
# La modération des images : les modèles ONNX, exécutés en Rust.
tract-onnx = "0.23.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
alley-moderation = { path = "moderation" }

[dev-dependencies]
# Les tests chiffrent exactement comme le navigateur : avec le même code Rust.
alley-web = { path = "client" }
# De vrais salons, en vraie WebSocket.
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Les modèles de modération calculent beaucoup : optimisés même en test.
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Le code du navigateur :
# `cargo build -p alley-web --lib --target wasm32-unknown-unknown --profile wasm-release`
# (voir `cargo xtask web`).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
