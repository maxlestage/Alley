# Déploie le serveur Alley (l'API chiffrée et sa WebSocket, le site aussi)
# sur Heroku, en HTTPS, sans la CLI Heroku : tout passe par l'API Platform
# (`cargo xtask heroku`, en Rust), ce qui se configure depuis un téléphone.
# Heroku construit l'image Docker lui-même (heroku.yml à la racine).
#
# À faire une fois (GitHub → Settings → Secrets and variables → Actions) :
#   - secret   HEROKU_API_KEY   Heroku → Account settings → API Key → Reveal
#   - variable HEROKU_APP_NAME  le nom de l'app (créée si elle n'existe pas)
#   - variable HEROKU_REGION    facultative : us (défaut) ou eu
# Sans eux, le déploiement est sauté (avec un avertissement).
#
# L'app est réglée pour accepter la version GitHub Pages
# (ALLEY_ALLOWED_ORIGINS = https://<propriétaire>.github.io).

name: Heroku

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: heroku
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_REGION: ${{ vars.HEROKU_REGION || 'us' }}
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Construit et publie sur Heroku, puis republie GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask heroku
