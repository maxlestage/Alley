# Déploie le serveur Alley (l'API chiffrée et sa WebSocket, le site aussi)
# sur Heroku, en HTTPS, sans la CLI Heroku : tout passe par l'API Platform,
# ce qui se configure depuis un téléphone. Heroku construit l'image Docker
# lui-même (heroku.yml à la racine).
#
# À faire une fois (GitHub → Settings → Secrets and variables → Actions) :
#   - secret   HEROKU_API_KEY   Heroku → Account settings → API Key → Reveal
#   - variable HEROKU_APP_NAME  le nom de l'app (créée si elle n'existe pas)
#   - variable HEROKU_REGION    facultative : us (défaut) ou eu
# Sans eux, le déploiement est sauté (avec un avertissement).
#
# L'app est réglée pour accepter la version GitHub Pages
# (ALLEY_ALLOWED_ORIGINS = https://<propriétaire>.github.io).

name: Heroku

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: heroku
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      APP: ${{ vars.HEROKU_APP_NAME }}
      REGION: ${{ vars.HEROKU_REGION || 'us' }}
      PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Construit et publie sur Heroku
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY:-}" ] || [ -z "${APP:-}" ]; then
            echo "::warning title=Heroku non configuré::Ajoutez le secret HEROKU_API_KEY et la variable HEROKU_APP_NAME (Settings → Secrets and variables → Actions) pour mettre l'API Alley en ligne."
            {
              echo "### Heroku n'est pas configuré"
              echo "Ajoutez le secret **HEROKU_API_KEY** et la variable **HEROKU_APP_NAME**, puis relancez ce workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          api() {
            curl -fsS -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              -H "Content-Type: application/json" "$@"
          }
          info="$RUNNER_TEMP/app.json"
          status=$(curl -sS -o "$info" -w '%{http_code}' \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$APP")
          case "$status" in
            200) echo "App $APP trouvée." ;;
            404)
              echo "Création de l'app $APP ($REGION)…"
              api -X POST https://api.heroku.com/apps \
                -d "{\"name\":\"$APP\",\"region\":\"$REGION\",\"stack\":\"container\"}" > "$info" ;;
            401) echo "::error::Heroku refuse la clé d'API (HEROKU_API_KEY)."; exit 1 ;;
            403) echo "::error::Ce compte Heroku ne peut pas utiliser l'app « $APP » (nom déjà pris ?)."; exit 1 ;;
            *) echo "::error::Réponse inattendue de Heroku ($status) : $(cat "$info")"; exit 1 ;;
          esac
          if [ "$(jq -r '.build_stack.name' "$info")" != "container" ]; then
            api -X PATCH "https://api.heroku.com/apps/$APP" -d '{"build_stack":"container"}' > /dev/null
          fi
          # La version GitHub Pages a le droit d'appeler l'API.
          api -X PATCH "https://api.heroku.com/apps/$APP/config-vars" \
            -d "{\"ALLEY_ALLOWED_ORIGINS\":\"${PAGES_ORIGIN,,}\"}" > /dev/null

          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tgz" HEAD
          sources=$(api -X POST https://api.heroku.com/sources)
          curl -fsS -X PUT -H "Content-Type:" --data-binary @"$RUNNER_TEMP/source.tgz" \
            "$(jq -r '.source_blob.put_url' <<< "$sources")"

          echo "Construction sur Heroku (la première prend plusieurs minutes)…"
          build=$(api -X POST "https://api.heroku.com/apps/$APP/builds" \
            -d "{\"source_blob\":{\"url\":\"$(jq -r '.source_blob.get_url' <<< "$sources")\",\"version\":\"$GITHUB_SHA\"}}")
          id=$(jq -r '.id' <<< "$build")
          curl -sSN "$(jq -r '.output_stream_url' <<< "$build")" || true
          result=pending
          for _ in $(seq 1 240); do
            result=$(api "https://api.heroku.com/apps/$APP/builds/$id" | jq -r '.status')
            [ "$result" != "pending" ] && break
            sleep 5
          done
          if [ "$result" != "succeeded" ]; then
            echo "::error::La construction Heroku s'est terminée avec le statut « $result »."
            exit 1
          fi
          url=$(api "https://api.heroku.com/apps/$APP" | jq -r '.web_url')
          echo "### 🚀 API Alley en ligne : [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "En ligne : $url"
      # Le site GitHub Pages doit connaître l'adresse de l'API : on le republie.
      - name: Republie GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY" || true
