# Publie Alley sur GitHub Pages, en HTTPS : https://<propriétaire>.github.io/<dépôt>/
# (la vitrine et l'application, exportées par le serveur lui-même :
# `alley export`). L'application y parle à l'API Alley déployée sur Heroku.
#
# L'adresse de l'API vient, dans l'ordre :
#   1. de la variable ALLEY_API_URL (Settings → Secrets and variables → Actions) ;
#   2. sinon de l'app Heroku (HEROKU_API_KEY + HEROKU_APP_NAME) ;
#   3. sinon l'app demande l'adresse du serveur au premier lancement
# (`cargo xtask api-url`, en Rust).
#
# À faire une fois : Settings → Pages → Build and deployment → Source :
# GitHub Actions. En attendant, le workflow s'arrête avec une explication.

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: GitHub Pages est-il activé ?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask pages-enabled

  build:
    name: Construction
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Paquets est un dépôt privé : sans copie en cache, cargo a besoin d'un
      # jeton qui peut le lire (secret PAQUETS_TOKEN, facultatif).
      - name: Accès à Paquets
        env:
          PAQUETS_TOKEN: ${{ secrets.PAQUETS_TOKEN }}
        if: env.PAQUETS_TOKEN != ''
        run: git config --global url."https://x-access-token:${PAQUETS_TOKEN}@github.com/maxlestage/".insteadOf "https://github.com/maxlestage/"
      - name: Le navigateur, en WebAssembly
        run: cargo xtask web
      - id: pages
        uses: actions/configure-pages@v5
      - name: Adresse de l'API
        id: api
        env:
          ALLEY_API_URL: ${{ vars.ALLEY_API_URL }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: cargo xtask api-url
      - name: Export statique
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ALLEY_API_URL: ${{ steps.api.outputs.url }}
        run: cargo run --release -- export dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
