# Publie Alley sur GitHub Pages, en HTTPS : https://<propriétaire>.github.io/<dépôt>/
# (la vitrine et l'application, exportées par le serveur lui-même :
# `alley export`). L'application y parle à l'API Alley déployée sur Heroku.
#
# L'adresse de l'API vient, dans l'ordre :
#   1. de la variable ALLEY_API_URL (Settings → Secrets and variables → Actions) ;
#   2. sinon de l'app Heroku (HEROKU_API_KEY + HEROKU_APP_NAME) ;
#   3. sinon l'app demande l'adresse du serveur au premier lancement.
#
# À faire une fois : Settings → Pages → Build and deployment → Source :
# GitHub Actions. En attendant, le workflow s'arrête avec une explication.

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: GitHub Pages est-il activé ?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages est désactivé::Settings → Pages → Source : GitHub Actions, puis relancez ce workflow."
            {
              echo "### GitHub Pages n'est pas encore activé"
              echo "Settings → Pages → Build and deployment → Source : **GitHub Actions**, puis Actions → Pages → Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Construction
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Le navigateur, en WebAssembly
        run: cargo xtask web
      - id: pages
        uses: actions/configure-pages@v5
      - name: Adresse de l'API
        id: api
        env:
          API_URL: ${{ vars.ALLEY_API_URL }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP: ${{ vars.HEROKU_APP_NAME }}
        run: |
          url="${API_URL:-}"
          if [ -z "$url" ] && [ -n "${HEROKU_API_KEY:-}" ] && [ -n "${APP:-}" ]; then
            url=$(curl -fsS -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              "https://api.heroku.com/apps/$APP" | jq -r '.web_url // empty' || true)
          fi
          url="${url%/}"
          if [ -z "$url" ]; then
            echo "::warning title=Pas d'API configurée::L'app demandera l'adresse du serveur Alley au premier lancement. Déployez l'API (workflow Heroku) ou définissez la variable ALLEY_API_URL."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Export statique
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ALLEY_API_URL: ${{ steps.api.outputs.url }}
        run: cargo run --release -- export dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
