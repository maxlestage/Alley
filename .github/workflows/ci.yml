# Teste chaque push, puis fusionne automatiquement la branche dans master.
#
# - rust : formatage, compilation du navigateur en WebAssembly, clippy (serveur
#   et navigateur), tests (API, chiffrement imposé et recoupé avec les vecteurs
#   de Brocolis, rotation de clé, CORS, HTTPS, export GitHub Pages) ;
# - merge : quand tout est vert, la branche est fusionnée dans master (sauf
#   master elle-même et les branches wip/...), puis Heroku (l'API) et GitHub
#   Pages (le site) sont déployés.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (serveur et navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Le navigateur, en WebAssembly
        run: cargo xtask web
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p alley-web --target wasm32-unknown-unknown -- -D warnings
      - name: Tests (API, chiffrement Brocolis recoupé, rotation, CORS, HTTPS, export)
        run: cargo test --workspace

  merge:
    name: Fusion dans master
    needs: [rust]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fusionne ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "$BRANCH est déjà dans master."
            exit 0
          fi
          git merge --no-ff --no-edit "$SHA" -m "Merge branch '$BRANCH' into master (fusion automatique)"
          git push origin HEAD:master
          echo "::notice title=Fusion automatique::$BRANCH fusionnée dans master"
      # Un push fait avec GITHUB_TOKEN ne lance aucun workflow : on déploie à la main.
      - name: Déploie master (Heroku, puis GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Juste après la fusion, GitHub peut ne pas encore connaître un
          # workflow ajouté par cette branche : on réessaie un peu.
          for workflow in heroku.yml pages.yml; do
            for attempt in 1 2 3 4 5 6; do
              if gh workflow run "$workflow" --ref master --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              if [ "$attempt" = 6 ]; then
                echo "::warning::Impossible de lancer $workflow : lancez-le depuis Actions → $workflow → Run workflow."
              fi
              sleep 10
            done
          done
