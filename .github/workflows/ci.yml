# Teste chaque push, puis fusionne automatiquement la branche dans master.
#
# - rust : formatage, compilation du navigateur en WebAssembly, modèles de
#   modération, clippy (serveur, navigateur, outils), tests (API, chiffrement
#   recoupé avec les vecteurs de Brocolis, comptes, vérification des images et
#   blocage par IP, trois langues, CORS, HTTPS, export GitHub Pages) ;
# - merge : quand tout est vert, la branche est fusionnée dans master (sauf
#   master elle-même et les branches wip/...), puis Heroku (l'API) et GitHub
#   Pages (le site) sont déployés.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust (serveur et navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Paquets est un dépôt privé : sans copie en cache, cargo a besoin d'un
      # jeton qui peut le lire (secret PAQUETS_TOKEN, facultatif).
      - name: Accès à Paquets
        env:
          PAQUETS_TOKEN: ${{ secrets.PAQUETS_TOKEN }}
        if: env.PAQUETS_TOKEN != ''
        run: git config --global url."https://x-access-token:${PAQUETS_TOKEN}@github.com/maxlestage/".insteadOf "https://github.com/maxlestage/"
      - run: cargo fmt --all --check && cargo fmt --manifest-path xtask/Cargo.toml --check
      - name: Le navigateur, en WebAssembly
        run: cargo xtask web
      - name: Modèles de modération (en cache)
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('xtask/src/models.rs') }}
      - run: cargo xtask models
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p alley-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path xtask/Cargo.toml --features prompts -- -D warnings
      - name: Tests (API, chiffrement Brocolis recoupé, rotation, CORS, HTTPS, export)
        run: cargo test --workspace

  merge:
    name: Fusion dans master
    needs: [rust]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fusionne, puis lance Heroku et Pages (un push fait avec GITHUB_TOKEN ne
      # lance aucun workflow).
      - name: Fusionne ${{ github.ref_name }} et déploie
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask merge
