# Le projet Xcode de l'application iOS, décrit pour XcodeGen :
#   brew install xcodegen && cd ios && xcodegen && open Alley.xcodeproj
name: Alley
options:
  bundleIdPrefix: app.alley
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  AlleyKit:
    path: .
targets:
  Alley:
    type: application
    platform: iOS
    sources:
      - path: Alley
    dependencies:
      - package: AlleyKit
        product: AlleyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alley.ios
        PRODUCT_NAME: Alley
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Alley/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Alley:
    build:
      targets:
        Alley: all
    run:
      config: Debug
    archive:
      config: Release
