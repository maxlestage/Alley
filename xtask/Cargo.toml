[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Les tâches d'Alley, en Rust : compilation du navigateur, modèles de modération, déploiement"
publish = false

# Un espace de travail à part : voir le Cargo.toml de la racine.
[workspace]

[dependencies]
# Le générateur de wasm-bindgen, en bibliothèque : pas d'outil à installer.
# Même version que la crate wasm-bindgen de client/.
wasm-bindgen-cli-support = "=0.2.129"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
# Seulement pour recalculer les empreintes des descriptions (`prompts`).
flate2 = { version = "1", optional = true }
regex = { version = "1", optional = true }
tract-onnx = { version = "0.23.8", optional = true }

[features]
prompts = ["dep:flate2", "dep:regex", "dep:tract-onnx"]
